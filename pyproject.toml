[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "ai-multi-strategy-investment-system"
version = "0.1.0"
description = "DEV-M01: read-only Binance Spot connectivity"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["httpx==0.28.1", "python-dotenv==1.2.2", "websockets==17.2", "pandas==3.0.1", "numpy==2.3.5"]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in live Binance requests (excluded unless explicitly enabled)"]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["src/trading_system/observer/frozen"]

[tool.ruff.lint]
select = ["E", "F", "I"]
